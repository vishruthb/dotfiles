# Keep the prompt intentionally quiet:
# directory, project version when available, branch, line changes, repo state.
add_newline = true
command_timeout = 800
scan_timeout = 30

format = "$directory$python$custom$package$git_branch$git_metrics$git_status$line_break$character"

[directory]
format = "[$path]($style) "
style = "bold cyan"
truncation_length = 1
truncate_to_repo = true

[custom.seek_version]
when = "test -f main.go && grep -q 'version[[:space:]]*=' main.go"
command = "sed -n 's/.*version[[:space:]]*=[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p' main.go | head -n 1"
format = "[$output]($style) "
style = "bold green"

[package]
format = "[$version]($style) "
style = "bold green"

[python]
format = "[$virtualenv]($style) "
style = "bold yellow"
detect_extensions = []
detect_files = []
detect_folders = []

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_metrics]
disabled = false
format = "\\(([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"

[git_status]
format = "([$all_status$ahead_behind]($style)\\)) "
style = "bold yellow"
conflicted = "=${count}"
ahead = "ahead${count}"
behind = "behind${count}"
diverged = "ahead${ahead_count}/behind${behind_count}"
untracked = "?${count}"
stashed = "stash${count}"
modified = "!${count}"
staged = "+${count}"
renamed = ">${count}"
deleted = "x${count}"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
